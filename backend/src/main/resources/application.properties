spring.application.name=api
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:database}:${POSTGRES_INTERNAL_PORT:5432}/${POSTGRES_DATABASE_NAME}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE}

jwt.secretkey=${SPRING_JWT_SECRET_KEY}
cors.allowed-origin=${SPRING_CORS:http://localhost:4200}

# Connection Pool - CRÍTICO para K8s
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.initialization-fail-timeout=-1

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.redis.enabled=true

# Business Rule Limits & Configurations
app.limits.disponibilidad-max-dias=31
app.limits.cancelacion-default-horas=1
app.limits.cancelacion-min-horas=1
app.limits.cancelacion-max-horas=24
app.limits.duracion-turno-permitida=30,60,90,120
app.limits.horario-atencion-minuto-step=30
