name: Deploy Sale Partido

on:
  push:
    branches:
      - main
      - pre_prod

jobs:
  # ============================================================================
  # BUILD — Construir imágenes Docker
  # ============================================================================
  build:
    name: Build Docker Images
    runs-on: self-hosted
    outputs:
      image-tag: ${{ env.IMAGE_TAG }}
      namespace: ${{ env.NAMESPACE }}
      is-production: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "NAMESPACE=salepartido" >> $GITHUB_ENV
            echo "BUILD_CONFIG=production" >> $GITHUB_ENV
          else
            echo "NAMESPACE=salepartido-preprod" >> $GITHUB_ENV
            echo "BUILD_CONFIG=testing" >> $GITHUB_ENV
          fi
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build Backend Image
        run: |
          docker build -t salepartido-backend:${{ env.IMAGE_TAG }} -f backend/Dockerfile.prod ./backend
          echo "✅ Backend image built: salepartido-backend:${{ env.IMAGE_TAG }}"

      - name: Build Frontend Image
        run: |
          echo "Building frontend with config: ${{ env.BUILD_CONFIG }}"
          docker build \
            --build-arg BUILD_CONFIG=${{ env.BUILD_CONFIG }} \
            -t salepartido-frontend:${{ env.IMAGE_TAG }} \
            -f frontend/Dockerfile.prod ./frontend
          echo "✅ Frontend image built: salepartido-frontend:${{ env.IMAGE_TAG }}"

  # ============================================================================
  # PRE_PROD DEPLOY — Deploy directo sin canary (staging)
  # ============================================================================
  deploy-preprod:
    name: Deploy to Pre-Prod (Staging)
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/pre_prod'
    environment:
      name: pre_prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Docker images into containerd
        run: |
          docker save salepartido-backend:${{ needs.build.outputs.image-tag }} -o /tmp/backend.tar
          docker save salepartido-frontend:${{ needs.build.outputs.image-tag }} -o /tmp/frontend.tar
          sudo ctr -n k8s.io images import /tmp/backend.tar
          sudo ctr -n k8s.io images import /tmp/frontend.tar
          rm /tmp/backend.tar /tmp/frontend.tar
          echo "✅ Docker images imported into containerd"

      - name: Prepare K8s manifests for pre_prod
        run: |
          # Copia de manifests y limpia antes
          rm -rf /tmp/k8s-preprod
          cp -r k8s /tmp/k8s-preprod

          # Reemplazar namespace con sed explícito (inicio y fin de línea)
          find /tmp/k8s-preprod -name "*.yaml" -exec sed -i 's/^  namespace: salepartido$/  namespace: salepartido-preprod/' {} +

          # Reemplazar puertos
          sed -i 's/nodePort: 32328/nodePort: 32329/g' /tmp/k8s-preprod/backend.yaml
          sed -i 's/nodePort: 31167/nodePort: 31168/g' /tmp/k8s-preprod/frontend.yaml

          # Separar el almacenamiento de postgres: preprod NO debe compartir
          # el hostPath con prod (compartirlo corrompe la base de datos).
          sed -i 's#/mnt/data/salepartido/postgres#/mnt/data/salepartido-preprod/postgres#g' /tmp/k8s-preprod/postgres.yaml

          # Reemplazar dominios en ingress
          sed -i 's/sale-partido.com/preprod.sale-partido.com/g' /tmp/k8s-preprod/ingress.yaml

          # Verifica que no hay namespaces corruptos
          if grep -r "salepartido-preprod-preprod" /tmp/k8s-preprod/ 2>/dev/null; then
            echo "ERROR: Namespaces corruptos detectados"
            exit 1
          fi

      - name: Create namespace
        run: |
          kubectl create namespace salepartido-preprod --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Namespace created"

      - name: Apply K8s manifests for pre_prod
        run: |
          kubectl apply -f /tmp/k8s-preprod/configmap.yaml
          kubectl apply -f /tmp/k8s-preprod/secret.yaml
          kubectl apply -f /tmp/k8s-preprod/postgres.yaml
          kubectl apply -f /tmp/k8s-preprod/redis.yaml
          kubectl apply -f /tmp/k8s-preprod/backend.yaml
          kubectl apply -f /tmp/k8s-preprod/frontend.yaml
          kubectl apply -f /tmp/k8s-preprod/ingress.yaml
          echo "✅ All manifests applied"

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment/salepartido-backend -n salepartido-preprod
          kubectl rollout restart deployment/salepartido-frontend -n salepartido-preprod

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/salepartido-backend -n salepartido-preprod --timeout=120s
          kubectl rollout status deployment/salepartido-frontend -n salepartido-preprod --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pre-Prod Deployment Verified ==="
          kubectl get pods -n salepartido-preprod
          echo "✅ Pre-Prod deploy completado"

  # ============================================================================
  # PRODUCTION DEPLOY — Deploy simple a producción
  # ============================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Import Docker images into containerd
        run: |
          docker save salepartido-backend:${{ needs.build.outputs.image-tag }} -o /tmp/backend.tar
          docker save salepartido-frontend:${{ needs.build.outputs.image-tag }} -o /tmp/frontend.tar
          sudo ctr -n k8s.io images import /tmp/backend.tar
          sudo ctr -n k8s.io images import /tmp/frontend.tar
          rm /tmp/backend.tar /tmp/frontend.tar
          echo "✅ Docker images imported into containerd"

      - name: Create namespace
        run: |
          kubectl create namespace salepartido --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Namespace created"

      - name: Apply K8s manifests for production
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml
          echo "✅ All manifests applied"

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment/salepartido-backend -n salepartido
          kubectl rollout restart deployment/salepartido-frontend -n salepartido
          echo "✅ Deployments restarted"

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/salepartido-backend -n salepartido --timeout=120s
          kubectl rollout status deployment/salepartido-frontend -n salepartido --timeout=120s
          echo "✅ Deployments ready"

      - name: Verify production deployment
        run: |
          echo "=== Production Deployment Verified ==="
          kubectl get pods -n salepartido
          kubectl get svc -n salepartido
          echo "✅ Production deploy completado exitosamente"

