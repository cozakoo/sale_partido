apiVersion: apps/v1
kind: Deployment
metadata:
  name: salepartido-backend-canary
  namespace: salepartido
  labels:
    app: salepartido-backend
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salepartido-backend
      track: canary
  template:
    metadata:
      labels:
        app: salepartido-backend
        track: canary
    spec:
      containers:
      - name: backend
        image: salepartido-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://salepartido-postgres:5432/salepartido_database"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: salepartido-config
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: salepartido-secret
              key: POSTGRES_PASSWORD
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: salepartido-config
              key: REDIS_HOST
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: salepartido-config
              key: REDIS_PORT
        - name: SPRING_JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: salepartido-secret
              key: SPRING_JWT_SECRET_KEY
        - name: SPRING_PORT
          valueFrom:
            configMapKeyRef:
              name: salepartido-config
              key: SPRING_PORT
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: salepartido-secret
              key: REDIS_PASSWORD
        - name: SPRING_DATA_REDIS_DATABASE
          valueFrom:
            configMapKeyRef:
              name: salepartido-config
              key: REDIS_DATABASE
        - name: SPRING_CORS
          valueFrom:
            configMapKeyRef:
              name: salepartido-config
              key: SPRING_CORS
        # Health check para canary
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
