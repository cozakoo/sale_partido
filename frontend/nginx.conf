# Plantilla de nginx. El entrypoint oficial de la imagen nginx hace envsubst
# sobre /etc/nginx/templates/*.template y escribe el resultado en
# /etc/nginx/conf.d/default.conf al arrancar el contenedor.
#
# Variables inyectadas por entorno (docker-compose / k8s):
#   BACKEND_HOST  -> nombre del servicio backend (ej: "backend" en compose,
#                    "salepartido-backend" en k8s)
#   BACKEND_PORT  -> puerto del backend (8080)
#
# Asi no hay ninguna IP ni hostname hardcodeado: el frontend habla con el
# backend por la red interna y el navegador solo ve rutas relativas (/api/...).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # API proxy - reenvia /api/ al backend interno
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/;
        proxy_http_version 1.1;

        # Headers necesarios
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Angular routing - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache busting para assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable cache para index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
